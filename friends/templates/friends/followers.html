{% extends "base.html" %}

{% block title %}Followers{% endblock %}

{% block content %}

<div class="container">

    <h2 class="mb-4">Followers</h2>

    {% for follow in followers %}

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5>{{ follow.follower.username }}</h5>

                <small class="text-muted">
                    Following you since {{ follow.created_at|date:"d M Y" }}
                </small>
            </div>
        </div>

    {% empty %}

        <p class="text-muted">
            You don't have any followers yet.
        </p>

    {% endfor %}

</div>

{% endblock %}
