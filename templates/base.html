<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Social Platform{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            Social Platform
        </a>

        <div>
            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    Welcome, {{ user.username }}
                </span>
                
            
            
            <a class="btn btn-light me-2" href="{% url 'profile' %}">
                Profile
            </a>

            <a class="btn btn-light me-2" href="{% url 'friend_list' %}">
                Friends
            </a>

            <a class="btn btn-light me-2" href="{% url 'inbox' %}">
                Messages
            </a>

            <a class="btn btn-light me-2" href="{% url 'notifications' %}">
                Notifications
            </a>

            <a class="btn btn-light" href="{% url 'logout' %}">
                Logout
            </a>

            {% else %}

                <a class="btn btn-light me-2" href="{% url 'login' %}">
                    Login
                </a>

                <a class="btn btn-light" href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}
        </div>

    </div>
</nav>

<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
